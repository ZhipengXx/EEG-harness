<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1170" viewBox="0 0 1440 1170" role="img" aria-labelledby="title desc">
<title id="title">Planner and Critic select one research task</title>
<desc id="desc">Planner uses paper and experiment memory to propose two to four tasks. Critic can retrieve related experimental history before choosing one. New methods go to Designer with selected task context, not the planning history packet. Shown tasks illustrate supported categories, not a required mix.</desc>
<defs>
<marker id="arrow-ink" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="#15324F"/></marker>
<marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="#008478"/></marker>
<marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="#315BE8"/></marker>
</defs>
<rect width="1440" height="1170" fill="#F5F8FC"/>
<text x="64" y="49" fill="#315BE8" font-family="DejaVu Sans" font-size="24" font-weight="bold" text-anchor="start" letter-spacing="0">EEG-harness</text>
<text x="64" y="114" fill="#15324F" font-family="DejaVu Sans" font-size="48" font-weight="bold" text-anchor="start" letter-spacing="0">Compare plans before writing code.</text>
<text x="64" y="163" fill="#5B6B7C" font-family="DejaVu Sans" font-size="27" font-weight="normal" text-anchor="start" letter-spacing="0">One Planner proposes alternatives. One Critic compares the complete pool.</text>
<path d="M64 210 H724" fill="none" stroke="#008478" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M830 210 H1376" fill="none" stroke="#008478" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="64" y="256" fill="#008478" font-family="DejaVu Sans" font-size="31" font-weight="bold" text-anchor="start" letter-spacing="0">Planner retrieves</text>
<text x="64" y="300" fill="#5B6B7C" font-family="DejaVu Sans" font-size="27" font-weight="normal" text-anchor="start" letter-spacing="0">Relevant paper and experiment memory</text>
<text x="830" y="256" fill="#008478" font-family="DejaVu Sans" font-size="31" font-weight="bold" text-anchor="start" letter-spacing="0">Critic can add</text>
<text x="830" y="300" fill="#5B6B7C" font-family="DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" letter-spacing="0">Experiment history related to each plan</text>
<text x="64" y="380" fill="#315BE8" font-family="DejaVu Sans" font-size="34" font-weight="bold" text-anchor="start" letter-spacing="0">Propose 2–4 distinct plans</text>
<rect x="64" y="416" width="660" height="108" rx="6" fill="#EAF0FF" stroke="#315BE8" stroke-width="2"/>
<path d="M86 438 V502" fill="none" stroke="#315BE8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="108" y="459" fill="#315BE8" font-family="DejaVu Sans" font-size="31" font-weight="bold" text-anchor="start" letter-spacing="0">New method</text>
<text x="108" y="498" fill="#5B6B7C" font-family="DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" letter-spacing="0">Change a training recipe or EEG encoder.</text>
<rect x="64" y="540" width="660" height="108" rx="6" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="1.4"/>
<path d="M86 562 V626" fill="none" stroke="#C9D6E4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="108" y="583" fill="#15324F" font-family="DejaVu Sans" font-size="31" font-weight="bold" text-anchor="start" letter-spacing="0">Confirmation</text>
<text x="108" y="622" fill="#5B6B7C" font-family="DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" letter-spacing="0">Test a frozen method at full scope.</text>
<rect x="64" y="664" width="660" height="108" rx="6" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="1.4"/>
<path d="M86 686 V750" fill="none" stroke="#C9D6E4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="108" y="707" fill="#15324F" font-family="DejaVu Sans" font-size="31" font-weight="bold" text-anchor="start" letter-spacing="0">Validation</text>
<text x="108" y="746" fill="#5B6B7C" font-family="DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" letter-spacing="0">Evaluate a method in the selected scope.</text>
<rect x="64" y="788" width="660" height="108" rx="6" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="1.4"/>
<path d="M86 810 V874" fill="none" stroke="#C9D6E4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="108" y="831" fill="#15324F" font-family="DejaVu Sans" font-size="31" font-weight="bold" text-anchor="start" letter-spacing="0">Diagnosis</text>
<text x="108" y="870" fill="#5B6B7C" font-family="DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" letter-spacing="0">Analyze existing results without training.</text>
<path d="M744 470 H764 V842 H744" fill="none" stroke="#315BE8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M764 610 H820" fill="none" stroke="#315BE8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow-blue)"/>
<rect x="830" y="416" width="546" height="320" rx="8" fill="#FFFFFF" stroke="#315BE8" stroke-width="1.6"/>
<text x="864" y="470" fill="#315BE8" font-family="DejaVu Sans" font-size="35" font-weight="bold" text-anchor="start" letter-spacing="0">Independent Critic</text>
<text x="864" y="521" fill="#15324F" font-family="DejaVu Sans" font-size="28" font-weight="normal" text-anchor="start" letter-spacing="0">Compare scientific value</text>
<text x="864" y="565" fill="#15324F" font-family="DejaVu Sans" font-size="28" font-weight="normal" text-anchor="start" letter-spacing="0">Relate plans to earlier results</text>
<text x="864" y="609" fill="#15324F" font-family="DejaVu Sans" font-size="28" font-weight="normal" text-anchor="start" letter-spacing="0">Weigh information and cost</text>
<text x="864" y="684" fill="#315BE8" font-family="DejaVu Sans" font-size="27" font-weight="bold" text-anchor="start" letter-spacing="0">Choose one original proposal</text>
<path d="M1103 736 V778" fill="none" stroke="#315BE8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow-blue)"/>
<rect x="830" y="788" width="546" height="108" rx="8" fill="#315BE8" stroke="#315BE8" stroke-width="1.2"/>
<text x="864" y="832" fill="#FFFFFF" font-family="DejaVu Sans" font-size="30" font-weight="bold" text-anchor="start" letter-spacing="0">Selected task: new method</text>
<text x="864" y="871" fill="#FFFFFF" font-family="DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" letter-spacing="0">An illustrative selection</text>
<path d="M64 945 H1376" fill="none" stroke="#C9D6E4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="64" y="997" fill="#15324F" font-family="DejaVu Sans" font-size="31" font-weight="bold" text-anchor="start" letter-spacing="0">For a new method, Designer receives</text>
<text x="64" y="1043" fill="#5B6B7C" font-family="DejaVu Sans" font-size="28" font-weight="normal" text-anchor="start" letter-spacing="0">Selected task, this round’s settings, interfaces, and parent source.</text>
<text x="64" y="1085" fill="#5B6B7C" font-family="DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" letter-spacing="0">Execution materials are task-specific; planning history stays with Planner and Critic.</text>
<path d="M64 1100 H1376" fill="none" stroke="#C9D6E4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="64" y="1139" fill="#5B6B7C" font-family="DejaVu Sans" font-size="24" font-weight="normal" text-anchor="start" letter-spacing="0">Illustrative task types. Each round proposes alternatives allowed by the current study state.</text>
</svg>
