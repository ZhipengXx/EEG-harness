<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<title id="title">Two workflows, one workbench</title>
<desc id="desc">EEG/MEG retrieval research and fMRI response screening share a workbench, with separate protocols, state and memory.</desc>
