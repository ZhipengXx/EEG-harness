<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
<title id="title">EEG-harness: from a research question to the next experiment</title>
<desc id="desc">An agent research harness for EEG and MEG image retrieval. The neural signal, brain and gallery are conceptual illustrations, not experiment results.</desc>
