<text x="64" y="114" fill="#15324F" font-family="DejaVu Sans" font-size="48" font-weight="bold" text-anchor="start" letter-spacing="0">Each experiment informs the next.</text>
<text x="64" y="163" fill="#5B6B7C" font-family="DejaVu Sans" font-size="27" font-weight="normal" text-anchor="start" letter-spacing="0">The new-method path, with separate routes for reuse and diagnosis.</text>
