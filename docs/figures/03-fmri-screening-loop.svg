<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="970" viewBox="0 0 1440 970" role="img" aria-labelledby="title desc">
<title id="title">The fMRI screening workflow</title>
<desc id="desc">Screen an existing surface series or an image-generated TRIBE response with a gray control. Select checks, measure responses and update evidence. Reports stay within numeric consistency scope.</desc>
<defs>
<marker id="arrow-ink" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="#15324F"/></marker>
<marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="#008478"/></marker>
<marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="#315BE8"/></marker>
</defs>
<rect width="1440" height="970" fill="#F5F8FC"/>
<text x="64" y="49" fill="#315BE8" font-family="DejaVu Sans" font-size="24" font-weight="bold" text-anchor="start" letter-spacing="0">EEG-harness</text>
<text x="64" y="114" fill="#15324F" font-family="DejaVu Sans" font-size="48" font-weight="bold" text-anchor="start" letter-spacing="0">Inspect a predicted brain response.</text>
<text x="64" y="163" fill="#5B6B7C" font-family="DejaVu Sans" font-size="27" font-weight="normal" text-anchor="start" letter-spacing="0">A separate workflow for selecting checks and recording screening evidence.</text>
<rect x="64" y="231" width="360" height="510" rx="8" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="1.2"/>
<text x="96" y="288" fill="#008478" font-family="DejaVu Sans" font-size="36" font-weight="bold" text-anchor="start" letter-spacing="0">Input</text>
