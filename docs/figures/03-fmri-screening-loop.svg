<path d="M32 48 C58 31 73 47 71 67 C67 84 43 73 43 94 C43 109 62 114 77 103" fill="none" stroke="#008478" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
