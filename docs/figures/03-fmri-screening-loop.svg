<circle cx="40" cy="87" r="10" fill="#315BE8" stroke="none" stroke-width="0"/>
<circle cx="59" cy="100" r="7" fill="#315BE8" stroke="none" stroke-width="0"/>
<circle cx="167" cy="59" r="8" fill="#315BE8" stroke="none" stroke-width="0"/>
<circle cx="180" cy="104" r="11" fill="#315BE8" stroke="none" stroke-width="0"/>
</g>
<text x="96" y="529" fill="#15324F" font-family="DejaVu Sans" font-size="28" font-weight="bold" text-anchor="start" letter-spacing="0">Surface series</text>
<text x="96" y="576" fill="#5B6B7C" font-family="DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" letter-spacing="0">or image → TRIBE</text>
<text x="96" y="615" fill="#5B6B7C" font-family="DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" letter-spacing="0">with a gray control</text>
<text x="96" y="696" fill="#008478" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" letter-spacing="0">Run the initial checks.</text>
<rect x="510" y="231" width="400" height="204" rx="8" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="1.4"/>
<path d="M532 254 V412" fill="none" stroke="#315BE8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="552" y="280" fill="#315BE8" font-family="DejaVu Sans" font-size="31" font-weight="bold" text-anchor="start" letter-spacing="0">Choose checks</text>
<text x="552" y="321" fill="#5B6B7C" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" letter-spacing="0">Rule policy or LLM</text>
<text x="552" y="355" fill="#5B6B7C" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" letter-spacing="0">Use the current evidence</text>
<rect x="980" y="231" width="396" height="204" rx="8" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="1.4"/>
<path d="M1002 254 V412" fill="none" stroke="#008478" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="1022" y="280" fill="#008478" font-family="DejaVu Sans" font-size="31" font-weight="bold" text-anchor="start" letter-spacing="0">Measure</text>
<text x="1022" y="321" fill="#5B6B7C" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" letter-spacing="0">Run selected tools</text>
<text x="1022" y="355" fill="#5B6B7C" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" letter-spacing="0">Record their outputs</text>
<rect x="980" y="537" width="396" height="204" rx="8" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="1.4"/>
<path d="M1002 560 V718" fill="none" stroke="#008478" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="1022" y="586" fill="#008478" font-family="DejaVu Sans" font-size="31" font-weight="bold" text-anchor="start" letter-spacing="0">Update evidence</text>
<text x="1022" y="627" fill="#5B6B7C" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" letter-spacing="0">Inspect measurements</text>
<text x="1022" y="661" fill="#5B6B7C" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" letter-spacing="0">Continue or finish</text>
<rect x="510" y="537" width="400" height="204" rx="8" fill="#FFFFFF" stroke="#C9D6E4" stroke-width="1.4"/>
<path d="M532 560 V718" fill="none" stroke="#315BE8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="552" y="586" fill="#315BE8" font-family="DejaVu Sans" font-size="31" font-weight="bold" text-anchor="start" letter-spacing="0">Write report</text>
<text x="552" y="627" fill="#5B6B7C" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" letter-spacing="0">Record screening outcome</text>
<text x="552" y="661" fill="#5B6B7C" font-family="DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" letter-spacing="0">Scope and stopping reason</text>
<path d="M424 333 H500" fill="none" stroke="#008478" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow-teal)"/>
<path d="M910 333 H970" fill="none" stroke="#315BE8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow-blue)"/>
<path d="M1178 435 V527" fill="none" stroke="#008478" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow-teal)"/>
<path d="M980 639 H920" fill="none" stroke="#008478" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow-teal)"/>
<path d="M1376 639 H1410 V483 H710 V445" fill="none" stroke="#008478" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="7 7" marker-end="url(#arrow-teal)"/>
<text x="990" y="474" fill="#008478" font-family="DejaVu Sans" font-size="24" font-weight="normal" text-anchor="middle" letter-spacing="0">Replan as needed</text>
<text x="64" y="819" fill="#15324F" font-family="DejaVu Sans" font-size="28" font-weight="normal" text-anchor="start" letter-spacing="0">Numeric, temporal, surface, ROI, reference, and specificity checks</text>
<text x="64" y="864" fill="#008478" font-family="DejaVu Sans" font-size="28" font-weight="bold" text-anchor="start" letter-spacing="0">Report scope: numeric consistency only.</text>
<path d="M64 900 H1376" fill="none" stroke="#C9D6E4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="64" y="939" fill="#5B6B7C" font-family="DejaVu Sans" font-size="24" font-weight="normal" text-anchor="start" letter-spacing="0">Optional semantic and CortexMAE tools depend on configuration and available resources.</text>
</svg>
